<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossFit — Planificación Randy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #071220;
      --bg-card:     #0d1e30;
      --bg-inner:    #132840;
      --bg-row:      #1a3350;
      --lime:        #c8f500;
      --lime-dim:    rgba(200,245,0,0.09);
      --lime-glow:   rgba(200,245,0,0.22);
      --blue:        #38bdf8;
      --blue-dim:    rgba(56,189,248,0.1);
      --green:       #34d399;
      --text:        #e2f0ff;
      --text-sec:    #6ea8d8;
      --text-dim:    #2e5070;
      --border:      rgba(56,189,248,0.1);
      --border-lime: rgba(200,245,0,0.15);
      --shadow:      0 1px 4px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.35);
      --radius:      12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(7,18,32,0.97);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 62px; gap: 16px;
    }
    .topbar-left { display: flex; flex-direction: column; }
    .topbar-title {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 1.1rem; font-weight: 900;
      letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.1;
    }
    .topbar-title span { color: var(--lime); }
    .topbar-week {
      font-size: 0.65rem; font-weight: 600;
      color: var(--text-sec); letter-spacing: 2.5px;
      text-transform: uppercase; margin-top: 3px;
    }
    .topbar-week input {
      background: none; border: none; color: var(--text-sec);
      font: inherit; font-size: 0.65rem; letter-spacing: 2.5px;
      text-transform: uppercase; outline: none; width: 220px; cursor: default;
    }
    .topbar-week input[readonly] { pointer-events: none; }
    .topbar-week input:not([readonly]) { color: var(--lime); cursor: text; }

    .unlock-badge {
      display: none; align-items: center; gap: 6px;
      padding: 5px 12px;
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 20px; color: var(--green);
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .unlock-badge:hover { background: rgba(52,211,153,0.18); }
    .unlock-badge.visible { display: flex; }

    /* ── Días nav ── */
    .days-nav {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto;
      padding: 0 14px; scrollbar-width: none; gap: 2px;
    }
    .days-nav::-webkit-scrollbar { display: none; }
    .day-btn {
      flex-shrink: 0; padding: 0 16px; height: 52px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-sec);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      position: relative; bottom: -1px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .day-btn:hover { color: var(--text); background: rgba(200,245,0,0.04); }
    .day-btn.active { color: var(--lime); border-bottom-color: var(--lime); background: var(--lime-dim); }
    .day-num {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--bg-inner);
      font-size: 0.65rem; font-weight: 800; color: var(--text-sec);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, color 0.2s;
    }
    .day-btn.active .day-num { background: var(--lime); color: #071220; }
    .rest-badge {
      font-size: 0.55rem; background: var(--bg-inner); color: var(--text-dim);
      border-radius: 4px; padding: 1px 5px;
    }
    .day-btn.active .rest-badge { background: var(--lime-dim); color: var(--lime); }

    /* ── Main ── */
    main { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

    .day-panel { display: none; animation: fadeUp 0.25s ease; }
    .day-panel.active { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Day header ── */
    .day-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .day-meta { display: flex; flex-direction: column; gap: 4px; }
    .day-label {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 2.6rem; font-weight: 900;
      letter-spacing: 1px; text-transform: uppercase; line-height: 1;
    }
    .day-label span { color: var(--lime); }
    .day-sublabel {
      font-size: 0.65rem; font-weight: 700; color: var(--text-dim);
      letter-spacing: 2.5px; text-transform: uppercase;
    }

    /* ── Botones ── */
    .edit-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 18px;
      background: rgba(200,245,0,0.09);
      border: 1px solid rgba(200,245,0,0.22);
      border-radius: 8px; color: #c8f500;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s;
    }
    .edit-btn:hover { background: rgba(200,245,0,0.16); }
    .save-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 18px;
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 8px; color: #34d399;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s;
    }
    .save-btn:hover { background: rgba(52,211,153,0.18); }
    .pdf-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-sec);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; transition: background 0.2s, border-color 0.2s;
    }
    .pdf-btn:hover { background: var(--bg-inner); border-color: var(--blue); color: var(--blue); }

    /* ── Section card ── */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; margin-bottom: 8px;
      box-shadow: var(--shadow);
      position: relative; transition: border-color 0.2s;
    }
    .section-card::before {
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
      background: transparent; transition: background 0.2s;
    }
    .section-card:hover { border-color: rgba(56,189,248,0.2); }
    .section-card:hover::before { background: var(--lime); }

    .card-header {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 20px 15px 22px;
      border-bottom: 1px solid var(--border);
    }
    .card-badge {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .badge-lime   { background: rgba(200,245,0,0.12);  border: 1px solid rgba(200,245,0,0.2); }
    .badge-blue   { background: rgba(56,189,248,0.1);  border: 1px solid rgba(56,189,248,0.2); }
    .badge-red    { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); }
    .badge-purple { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.2); }

    .card-title {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 1.15rem; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase; flex: 1;
    }
    .card-body { padding: 18px 20px 18px 22px; }

    .content-text {
      font-size: 0.98rem; line-height: 2;
      color: rgba(226,240,255,0.76); white-space: pre-wrap;
    }
    .content-text:empty::after { content: '—'; color: var(--text-dim); }
    .content-text .num { color: var(--lime); font-weight: 700; }

    .vid-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px;
      color: #071220; background: var(--lime);
      border-radius: 10px; padding: 2px 9px;
      text-decoration: none; vertical-align: middle;
      margin-left: 6px; transition: opacity 0.15s;
    }
    .vid-link:hover { opacity: 0.82; }

    .section-card textarea {
      display: none; width: 100%;
      background: var(--bg-inner);
      border: 1px solid var(--border-lime);
      border-radius: 8px; color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.95rem; line-height: 1.8;
      padding: 12px 14px; resize: vertical; min-height: 90px;
      outline: none; margin-top: 4px;
    }
    .section-card textarea:focus { border-color: var(--lime); }

    .insert-vid-btn {
      display: none; align-items: center; gap: 6px;
      margin-top: 10px; padding: 6px 14px;
      background: transparent;
      border: 1px dashed rgba(200,245,0,0.25);
      border-radius: 20px; color: var(--lime);
      font-family: inherit; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer; transition: background 0.15s;
    }
    .insert-vid-btn:hover { background: var(--lime-dim); }
    .insert-vid-btn.visible { display: inline-flex; }

    /* miniaturas de video */
    .video-thumbs {
      display: flex; gap: 10px; flex-wrap: wrap;
      padding: 12px 22px 16px; border-top: 1px solid var(--border);
    }
    .video-thumb-item {
      position: relative; width: 130px; border-radius: 10px;
      overflow: hidden; cursor: pointer; text-decoration: none; flex-shrink: 0;
    }
    .video-thumb-item img { width: 100%; height: 74px; object-fit: cover; display: block; }
    .video-thumb-placeholder-img {
      width: 100%; height: 74px; background: var(--bg-row);
      display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
    }
    .video-play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .video-thumb-item:hover .video-play-overlay { background: rgba(0,0,0,0.2); }
    .play-circle {
      width: 28px; height: 28px; background: var(--lime);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .play-circle svg { margin-left: 2px; }
    .video-name {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      padding: 12px 8px 5px; font-size: 0.68rem; font-weight: 700; color: #fff;
    }

    /* ── Nota bridge ── */
    .note-bridge {
      position: relative; margin: 4px 0;
      padding: 10px 16px 10px 42px;
      background: rgba(200,245,0,0.03);
      border: 1px dashed rgba(200,245,0,0.12);
      border-radius: 10px; min-height: 36px;
    }
    .note-bridge::before {
      content: '📝'; position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 0.85rem;
    }
    .note-bridge .note-text {
      color: rgba(200,245,0,0.6); font-size: 0.82rem;
      line-height: 1.6; white-space: pre-wrap;
    }
    .note-bridge .note-text:empty::after { content: 'Sin nota'; color: var(--text-dim); font-style: italic; }
    .note-bridge textarea {
      display: none; width: 100%; background: transparent; border: none;
      border-bottom: 1px dashed rgba(200,245,0,0.2);
      color: rgba(200,245,0,0.8); font-family: inherit;
      font-size: 0.82rem; line-height: 1.6; padding: 2px 0;
      resize: vertical; min-height: 32px; outline: none;
    }
    .note-bridge textarea::placeholder { color: rgba(200,245,0,0.2); }
    .note-bridge textarea:focus { border-bottom-color: rgba(200,245,0,0.45); }

    /* ── Workout 2 toggle ── */
    .w2-toggle-row { display: flex; align-items: center; justify-content: center; margin: 6px 0; }
    .w2-toggle-btn {
      padding: 7px 16px; background: transparent;
      border: 1px dashed var(--text-dim); border-radius: 20px; color: var(--text-dim);
      font-family: inherit; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .w2-toggle-btn:hover { border-color: var(--lime); color: var(--lime); }
    .w2-toggle-btn.active { border-color: var(--lime); color: var(--lime); background: var(--lime-dim); }
    .w2-block { display: none; }
    .w2-block.visible { display: block; }

    /* ── Descanso ── */
    .rest-screen { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; text-align: center; }
    .rest-icon-wrap {
      width: 80px; height: 80px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .rest-title {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 1.8rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 3px;
      color: var(--text-dim); margin-bottom: 8px;
    }
    .rest-sub { font-size: 0.85rem; color: var(--text-dim); }

    /* ── Modales ── */
    .url-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 2000;
      align-items: center; justify-content: center;
    }
    .url-modal.visible { display: flex; animation: fadeUp 0.15s ease; }
    .url-modal-box {
      background: var(--bg-card); border: 1px solid var(--border-lime);
      border-radius: 16px; padding: 24px; width: 420px; max-width: 95vw;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .url-modal-box h4 {
      font-size: 0.78rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--lime); margin-bottom: 16px;
    }
    .url-modal-box label { display: block; font-size: 0.7rem; color: var(--text-sec); margin-bottom: 5px; margin-top: 12px; }
    .url-modal-box input[type="text"] {
      width: 100%; background: var(--bg-inner); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 0.9rem; padding: 9px 12px; outline: none;
    }
    .url-modal-box input[type="text"]:focus { border-color: var(--lime); }
    .url-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .url-insert-btn {
      padding: 9px 20px; background: var(--lime); color: #071220; border: none;
      border-radius: 8px; font-family: inherit; font-weight: 800;
      font-size: 0.8rem; text-transform: uppercase; cursor: pointer;
    }
    .url-insert-btn:hover { opacity: 0.88; }
    .url-cancel-btn {
      padding: 9px 20px; background: var(--bg-inner); color: var(--text-sec);
      border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
      font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer;
    }
    .url-cancel-btn:hover { background: var(--bg-row); }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; animation: fadeUp 0.2s ease; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-top: 3px solid var(--lime); border-radius: 16px;
      padding: 32px; width: 340px; text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .modal-box .lock-icon { font-size: 2.2rem; margin-bottom: 12px; }
    .modal-box h2 {
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 1.3rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 2px; color: var(--lime); margin-bottom: 6px;
    }
    .modal-box p { font-size: 0.78rem; color: var(--text-sec); margin-bottom: 20px; }
    .modal-box input[type="password"] {
      width: 100%; background: var(--bg-inner); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 1rem;
      padding: 10px 14px; outline: none; margin-bottom: 12px;
      letter-spacing: 3px; font-family: inherit;
    }
    .modal-box input[type="password"]:focus { border-color: var(--lime); }
    .error-msg { color: #f87171; font-size: 0.78rem; margin-bottom: 10px; min-height: 18px; }
    .modal-actions { display: flex; gap: 8px; }
    .btn-confirm {
      flex: 1; padding: 10px; background: var(--lime); color: #071220; border: none;
      border-radius: 8px; font-family: inherit; font-weight: 800;
      font-size: 0.82rem; text-transform: uppercase; cursor: pointer;
    }
    .btn-confirm:hover { opacity: 0.88; }
    .btn-cancel {
      flex: 1; padding: 10px; background: var(--bg-inner); color: var(--text-sec);
      border: 1px solid var(--border); border-radius: 8px; font-family: inherit;
      font-weight: 700; font-size: 0.82rem; text-transform: uppercase; cursor: pointer;
    }
    .btn-cancel:hover { background: var(--bg-row); }

    /* ── Impresión ── */
    @media print {
      .topbar, .days-nav, .modal-overlay, .url-modal,
      .edit-btn, .save-btn, .pdf-btn, .insert-vid-btn, .w2-toggle-row,
      .note-bridge textarea, .section-card textarea { display: none !important; }
      .day-panel { display: none !important; }
      .day-panel.active { display: block !important; }
      .note-bridge .note-text { display: block !important; }
      body { background: #fff !important; color: #111 !important; }
      main { padding: 12px !important; max-width: 100% !important; }
      .section-card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
      .content-text { color: #333 !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<!-- Modal contraseña -->
<div class="modal-overlay" id="pwd-modal">
  <div class="modal-box">
    <div class="lock-icon">🔒</div>
    <h2>Modo edición</h2>
    <p>Introduce tu contraseña para editar</p>
    <input type="password" id="pwd-input" placeholder="••••••••"
           onkeydown="if(event.key==='Enter') confirmPwd()" />
    <div class="error-msg" id="pwd-error"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePwdModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmPwd()">Desbloquear</button>
    </div>
  </div>
</div>

<!-- Mini-modal insertar video -->
<div class="url-modal" id="url-modal">
  <div class="url-modal-box">
    <h4>🎬 Insertar "ver video"</h4>
    <label>Nombre del ejercicio</label>
    <input type="text" id="url-exercise" placeholder="Ej: Thruster" />
    <label>URL del video (YouTube u otro)</label>
    <input type="text" id="url-link" placeholder="https://www.youtube.com/watch?v=..." />
    <div class="url-actions">
      <button class="url-cancel-btn" onclick="closeUrlModal()">Cancelar</button>
      <button class="url-insert-btn" onclick="doInsertVideo()">Insertar</button>
    </div>
  </div>
</div>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-title">CrossFit <span>·</span> Planificación Randy</div>
    <div class="topbar-week">
      <input type="text" id="semana-input" placeholder="SEMANA — selecciona fechas" readonly />
    </div>
  </div>
  <button class="unlock-badge" id="unlock-badge" onclick="lockSession()">
    🔓 Desbloqueado
  </button>
</div>

<!-- Días nav -->
<nav class="days-nav">
  <button class="day-btn active" onclick="showDay('lunes',this)"><span class="day-num">1</span> Lunes</button>
  <button class="day-btn" onclick="showDay('martes',this)"><span class="day-num">2</span> Martes</button>
  <button class="day-btn" onclick="showDay('miercoles',this)"><span class="day-num">3</span> Miércoles</button>
  <button class="day-btn" onclick="showDay('jueves',this)"><span class="day-num">4</span> Jueves</button>
  <button class="day-btn" onclick="showDay('viernes',this)"><span class="day-num">5</span> Viernes</button>
  <button class="day-btn" onclick="showDay('sabado',this)"><span class="day-num">6</span> Sábado</button>
  <button class="day-btn" onclick="showDay('domingo',this)"><span class="day-num">7</span> Domingo <span class="rest-badge">REST</span></button>
</nav>

<main>
  <div id="panel-lunes"     class="day-panel active" data-day="lunes"></div>
  <div id="panel-martes"    class="day-panel"        data-day="martes"></div>
  <div id="panel-miercoles" class="day-panel"        data-day="miercoles"></div>
  <div id="panel-jueves"    class="day-panel"        data-day="jueves"></div>
  <div id="panel-viernes"   class="day-panel"        data-day="viernes"></div>
  <div id="panel-sabado"    class="day-panel"        data-day="sabado"></div>

  <!-- DOMINGO -->
  <div id="panel-domingo" class="day-panel">
    <div class="day-header">
      <div class="day-meta">
        <div class="day-label">Domingo <span>/ REST</span></div>
        <div class="day-sublabel">Recuperación activa</div>
      </div>
    </div>
    <div class="rest-screen">
      <div class="rest-icon-wrap">🛌</div>
      <div class="rest-title">Día de descanso</div>
      <div class="rest-sub">Movilidad suave, foam roller o reposo completo</div>
    </div>
    <div class="section-card">
      <div class="card-header">
        <div class="card-badge badge-purple">📋</div>
        <div class="card-title">Notas de recuperación</div>
      </div>
      <div class="card-body">
        <div class="content-text" id="domingo-notas"></div>
        <textarea id="domingo-notas-edit"></textarea>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="edit-btn" id="domingo-edit-btn" onclick="toggleDomingo()">✏️ Editar notas</button>
    </div>
  </div>
</main>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const DAYS_TRAINING = ['lunes','martes','miercoles','jueves','viernes','sabado'];
const DAYS_ALL      = [...DAYS_TRAINING,'domingo'];
const MAIN_SECS     = ['calentamiento','levantamiento','workout1','workout2','accesorios'];
const NOTE_KEYS     = ['nota1','nota2','nota3','nota4'];

const DAY_LABELS = {
  lunes:'Lunes/Día 1', martes:'Martes/Día 2', miercoles:'Miércoles/Día 3',
  jueves:'Jueves/Día 4', viernes:'Viernes/Día 5', sabado:'Sábado/Día 6',
};

const SEC_CONFIG = {
  calentamiento: { badge:'badge-lime', icon:'🔥', label:'Calentamiento',   ph:'Describe el calentamiento...' },
  levantamiento: { badge:'badge-blue', icon:'🏋️', label:'Levantamiento',   ph:'Series, repeticiones, % de 1RM...' },
  workout1:      { badge:'badge-red',  icon:'⚡', label:'Workout 1',       ph:'AMRAP, Para tiempo, EMOM...' },
  workout2:      { badge:'badge-red',  icon:'⚡', label:'Workout 2',       ph:'Segundo workout del día...' },
  accesorios:    { badge:'badge-purple',icon:'💪',label:'Accesorios',      ph:'Ejercicios accesorios, core, movilidad...' },
};

const DEFAULTS = {
  calentamiento:`3 rondas:
- 400m trote suave
- 10 hip circles cada lado
- 10 dislocaciones con palo
- 15 hollow rocks`,
  levantamiento:`Back Squat – 5 × 5
Empezar al 70% 1RM.
Aumentar carga si la técnica es sólida.`,
  workout1:`AMRAP 20 min:
- 5 Pull-ups
- 10 Push-ups
- 15 Air Squats`,
  workout2:'',
  accesorios:`- 3 × 15 GHD Sit-ups
- 3 × 12 Single-leg RDL cada lado
- 2 min plank hold`,
  nota1:'', nota2:'', nota3:'', nota4:'',
};

const DOMINGO_DEFAULT =`- Foam roller cuerpo completo 10 min
- Yoga o stretching 20-30 min
- Hidratación mínima 2.5 L
- Dormir 8 horas`;

// ─── Contraseña ───────────────────────────────────────────────────────────────
// Contraseña por defecto: crossfit2025
// Para cambiarla: cambiarContrasena('nueva_clave')
let sessionUnlocked = false;
let pendingCb = null;

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function getStoredHash() {
  let h = localStorage.getItem('cf_pwd_hash');
  if (!h) { h = await sha256('crossfit2025'); localStorage.setItem('cf_pwd_hash', h); }
  return h;
}
window.cambiarContrasena = async function(nueva) {
  if (!sessionUnlocked) { alert('Debes estar desbloqueado primero.'); return; }
  localStorage.setItem('cf_pwd_hash', await sha256(nueva));
  alert('Contraseña cambiada correctamente.');
};
function requireAuth(cb) {
  if (sessionUnlocked) { cb(); return; }
  pendingCb = cb; openPwdModal();
}
function openPwdModal() {
  document.getElementById('pwd-input').value = '';
  document.getElementById('pwd-error').textContent = '';
  document.getElementById('pwd-modal').classList.add('visible');
  setTimeout(() => document.getElementById('pwd-input').focus(), 80);
}
function closePwdModal() {
  document.getElementById('pwd-modal').classList.remove('visible');
  pendingCb = null;
}
async function confirmPwd() {
  const val = document.getElementById('pwd-input').value;
  if (!val) return;
  if (await sha256(val) === await getStoredHash()) {
    sessionUnlocked = true;
    document.getElementById('unlock-badge').classList.add('visible');
    closePwdModal();
    if (pendingCb) { pendingCb(); pendingCb = null; }
  } else {
    document.getElementById('pwd-error').textContent = 'Contraseña incorrecta';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}
function lockSession() {
  sessionUnlocked = false;
  document.getElementById('unlock-badge').classList.remove('visible');
  DAYS_TRAINING.forEach(d => { if (editingState[d]) doSave(d); });
  if (editingDomingo) toggleDomingo();
}
document.getElementById('pwd-modal').addEventListener('click', e => {
  if (e.target.id === 'pwd-modal') closePwdModal();
});

// ─── Navegación ───────────────────────────────────────────────────────────────
function showDay(day, btn) {
  DAYS_ALL.forEach(d => document.getElementById('panel-'+d).classList.remove('active'));
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-'+day).classList.add('active');
  btn.classList.add('active');
}

// ─── Exportar PDF ─────────────────────────────────────────────────────────────
function exportPDF() {
  window.print();
}

// ─── Render de contenido ──────────────────────────────────────────────────────
const PLAY_SVG = `<svg width="7" height="8" viewBox="0 0 7 8" fill="currentColor"><path d="M0 0L7 4 0 8z"/></svg>`;

function renderContent(raw) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Escapar primero, luego procesar links [URL]
  let html = esc(raw);
  // Links inline: texto antes de [URL] o solo [URL]
  html = html.replace(/\[(https?:\/\/[^\]]+)\]/g,
    (_,url) => `<a class="vid-link" href="${url}" target="_blank" rel="noopener noreferrer">${PLAY_SVG} ver video</a>`);
  // Saltos de línea
  html = html.replace(/\n/g,'<br>');
  return html;
}

function getRaw(day, key) {
  const s = localStorage.getItem('cf_'+day+'_'+key);
  return s !== null ? s : (DEFAULTS[key] ?? '');
}

// ─── Videos (miniaturas en card) ──────────────────────────────────────────────
function getYTId(url) {
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('?')[0];
    return u.searchParams.get('v');
  } catch { return null; }
}

function extractVideos(raw) {
  const results = [];
  const rx = /([^\[\n]*)\[(https?:\/\/[^\]]+)\]/g;
  let m;
  while ((m = rx.exec(raw)) !== null) {
    results.push({ label: m[1].replace(/^[-\s*]+/, '').trim() || 'Ver video', url: m[2] });
  }
  return results;
}

function renderVideoThumbs(day, key, videos) {
  const container = document.getElementById(day+'-'+key+'-thumbs');
  if (!container) return;
  if (!videos.length) { container.style.display='none'; return; }
  container.style.display = '';
  container.innerHTML = '';
  videos.forEach(v => {
    const ytId = getYTId(v.url);
    const a = document.createElement('a');
    a.href = v.url; a.target='_blank'; a.rel='noopener noreferrer';
    a.className = 'video-thumb-item';
    if (ytId) {
      const img = document.createElement('img');
      img.src = `https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
      img.alt = v.label;
      img.onerror = function() {
        const ph = document.createElement('div');
        ph.className='video-thumb-placeholder-img'; ph.textContent='▶';
        this.replaceWith(ph);
      };
      a.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className='video-thumb-placeholder-img'; ph.textContent='🔗';
      a.appendChild(ph);
    }
    const overlay = document.createElement('div');
    overlay.className='video-play-overlay';
    overlay.innerHTML=`<div class="play-circle">${PLAY_SVG}</div>`;
    a.appendChild(overlay);
    const name = document.createElement('div');
    name.className='video-name';
    name.textContent = v.label;
    a.appendChild(name);
    container.appendChild(a);
  });
}

// ─── Construcción del panel ───────────────────────────────────────────────────
function secHTML(day, key) {
  const c = SEC_CONFIG[key];
  return `
    <div class="section-card">
      <div class="card-header">
        <div class="card-badge ${c.badge}">${c.icon}</div>
        <div class="card-title">${c.label}</div>
      </div>
      <div class="card-body">
        <div class="content-text" id="${day}-${key}"></div>
        <textarea id="${day}-${key}-edit" placeholder="${c.ph}"></textarea>
        <button class="insert-vid-btn" id="${day}-${key}-vidbtn"
                onclick="openUrlModal('${day}-${key}-edit')">
          🎬 Insertar "ver video"
        </button>
      </div>
      <div class="video-thumbs" id="${day}-${key}-thumbs" style="display:none"></div>
    </div>`;
}

function buildDayPanel(day) {
  const panel = document.getElementById('panel-'+day);
  const [name, sub] = DAY_LABELS[day].split('/');
  panel.innerHTML = `
    <div class="day-header">
      <div class="day-meta">
        <div class="day-label">${name} <span>/ ${sub}</span></div>
        <div class="day-sublabel">${sub}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="pdf-btn" onclick="exportPDF()">⬇ PDF</button>
        <button class="edit-btn" id="${day}-edit-btn" onclick="toggleEdit('${day}')">✏️ Editar</button>
      </div>
    </div>

    ${secHTML(day,'calentamiento')}
    <div class="note-bridge">
      <div class="note-text" id="${day}-nota1"></div>
      <textarea id="${day}-nota1-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    ${secHTML(day,'levantamiento')}
    <div class="note-bridge">
      <div class="note-text" id="${day}-nota2"></div>
      <textarea id="${day}-nota2-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    ${secHTML(day,'workout1')}
    <div class="note-bridge">
      <div class="note-text" id="${day}-nota3"></div>
      <textarea id="${day}-nota3-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    <div class="w2-toggle-row">
      <button class="w2-toggle-btn" id="${day}-w2-btn" onclick="toggleW2('${day}')">＋ Agregar Workout 2</button>
    </div>
    <div class="w2-block" id="${day}-w2-block">
      ${secHTML(day,'workout2')}
      <div class="note-bridge">
        <div class="note-text" id="${day}-nota4"></div>
        <textarea id="${day}-nota4-edit" placeholder="Nota para el atleta..."></textarea>
      </div>
    </div>

    ${secHTML(day,'accesorios')}
  `;
}

// ─── Edición ──────────────────────────────────────────────────────────────────
let editingState = {};

function toggleEdit(day) {
  requireAuth(() => { editingState[day] ? doSave(day) : doOpen(day); });
}

function doOpen(day) {
  MAIN_SECS.forEach(k => {
    const display = document.getElementById(day+'-'+k);
    const ta      = document.getElementById(day+'-'+k+'-edit');
    const vidbtn  = document.getElementById(day+'-'+k+'-vidbtn');
    const thumbs  = document.getElementById(day+'-'+k+'-thumbs');
    if (!display || !ta) return;
    ta.value = getRaw(day, k);
    display.style.display = 'none';
    ta.style.display = 'block';
    if (vidbtn) vidbtn.classList.add('visible');
    if (thumbs) thumbs.style.display = 'none';
  });
  NOTE_KEYS.forEach(k => {
    const d = document.getElementById(day+'-'+k);
    const t = document.getElementById(day+'-'+k+'-edit');
    if (!d||!t) return;
    t.value = getRaw(day, k);
    d.style.display = 'none'; t.style.display = 'block';
  });
  document.getElementById('semana-input').removeAttribute('readonly');
  const btn = document.getElementById(day+'-edit-btn');
  if (btn) { btn.textContent = '✔ Guardar'; btn.className = 'save-btn'; }
  editingState[day] = true;
}

function doSave(day) {
  MAIN_SECS.forEach(k => {
    const display = document.getElementById(day+'-'+k);
    const ta      = document.getElementById(day+'-'+k+'-edit');
    const vidbtn  = document.getElementById(day+'-'+k+'-vidbtn');
    if (!display||!ta) return;
    const raw = ta.value;
    display.innerHTML = renderContent(raw);
    ta.style.display = 'none';
    display.style.display = '';
    if (vidbtn) vidbtn.classList.remove('visible');
    renderVideoThumbs(day, k, extractVideos(raw));
    try { localStorage.setItem('cf_'+day+'_'+k, raw); } catch(e) {}
  });
  NOTE_KEYS.forEach(k => {
    const d = document.getElementById(day+'-'+k);
    const t = document.getElementById(day+'-'+k+'-edit');
    if (!d||!t) return;
    d.textContent = t.value; t.style.display='none'; d.style.display='';
    try { localStorage.setItem('cf_'+day+'_'+k, t.value); } catch(e) {}
  });
  document.getElementById('semana-input').setAttribute('readonly', true);
  try { localStorage.setItem('cf_semana', document.getElementById('semana-input').value); } catch(e) {}
  const btn = document.getElementById(day+'-edit-btn');
  if (btn) { btn.textContent = '✏️ Editar'; btn.className = 'edit-btn'; }
  editingState[day] = false;
}

// ─── Workout 2 ────────────────────────────────────────────────────────────────
function toggleW2(day) {
  requireAuth(() => {
    const block = document.getElementById(day+'-w2-block');
    const btn   = document.getElementById(day+'-w2-btn');
    const vis   = block.classList.toggle('visible');
    btn.classList.toggle('active', vis);
    btn.textContent = vis ? '✕ Quitar Workout 2' : '＋ Agregar Workout 2';
    try { localStorage.setItem('cf_'+day+'_w2visible', vis?'1':'0'); } catch(e) {}
  });
}

// ─── Domingo ──────────────────────────────────────────────────────────────────
let editingDomingo = false;
function toggleDomingo() {
  requireAuth(() => {
    const d = document.getElementById('domingo-notas');
    const t = document.getElementById('domingo-notas-edit');
    const b = document.getElementById('domingo-edit-btn');
    if (!editingDomingo) {
      t.value = d.textContent || DOMINGO_DEFAULT;
      d.style.display='none'; t.style.display='block';
      b.textContent='✔ Guardar'; b.className='save-btn';
      editingDomingo=true;
    } else {
      d.textContent=t.value; t.style.display='none'; d.style.display='';
      b.textContent='✏️ Editar notas'; b.className='edit-btn';
      try { localStorage.setItem('cf_domingo_notas', t.value); } catch(e) {}
      editingDomingo=false;
    }
  });
}

// ─── Campo semana ─────────────────────────────────────────────────────────────
document.getElementById('semana-input').addEventListener('click', function() {
  if (this.hasAttribute('readonly'))
    requireAuth(() => { this.removeAttribute('readonly'); this.focus(); });
});

// ─── URL modal ────────────────────────────────────────────────────────────────
let activeTA = null;
function openUrlModal(taId) {
  activeTA = taId;
  document.getElementById('url-exercise').value = '';
  document.getElementById('url-link').value = '';
  document.getElementById('url-modal').classList.add('visible');
  setTimeout(() => document.getElementById('url-exercise').focus(), 80);
}
function closeUrlModal() {
  document.getElementById('url-modal').classList.remove('visible');
  activeTA = null;
}
function doInsertVideo() {
  const exercise = document.getElementById('url-exercise').value.trim();
  const url      = document.getElementById('url-link').value.trim();
  if (!url) { document.getElementById('url-link').focus(); return; }
  const ta = document.getElementById(activeTA);
  if (!ta) { closeUrlModal(); return; }
  const insert = exercise ? `${exercise} [${url}]` : `[${url}]`;
  const start=ta.selectionStart, end=ta.selectionEnd;
  if (start !== end) {
    const sel = ta.value.substring(start,end);
    const rep = `${sel} [${url}]`;
    ta.value = ta.value.substring(0,start)+rep+ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start+rep.length;
  } else {
    const before=ta.value.substring(0,start), after=ta.value.substring(start);
    const pre=(before.length>0&&!before.endsWith('\n'))?'\n':'';
    const suf=(after.length>0&&!after.startsWith('\n'))?'\n':'';
    ta.value=before+pre+insert+suf+after;
    ta.selectionStart=ta.selectionEnd=before.length+pre.length+insert.length;
  }
  ta.focus();
  closeUrlModal();
}
document.getElementById('url-modal').addEventListener('click', e => {
  if (e.target.id==='url-modal') closeUrlModal();
});
document.getElementById('url-link').addEventListener('keydown', e => {
  if (e.key==='Enter') doInsertVideo();
});

// ─── Carga inicial ────────────────────────────────────────────────────────────
function loadDay(day) {
  MAIN_SECS.forEach(k => {
    const el = document.getElementById(day+'-'+k);
    if (!el) return;
    const raw = getRaw(day, k);
    el.innerHTML = renderContent(raw);
    renderVideoThumbs(day, k, extractVideos(raw));
  });
  NOTE_KEYS.forEach(k => {
    const el = document.getElementById(day+'-'+k);
    if (el) el.textContent = getRaw(day, k);
  });
  if (localStorage.getItem('cf_'+day+'_w2visible')==='1') {
    const block=document.getElementById(day+'-w2-block');
    const btn=document.getElementById(day+'-w2-btn');
    if (block) { block.classList.add('visible'); btn.classList.add('active'); btn.textContent='✕ Quitar Workout 2'; }
  }
}

function init() {
  DAYS_TRAINING.forEach(day => { buildDayPanel(day); loadDay(day); });
  const domSaved = localStorage.getItem('cf_domingo_notas');
  document.getElementById('domingo-notas').textContent = domSaved !== null ? domSaved : DOMINGO_DEFAULT;
  const sem = localStorage.getItem('cf_semana');
  if (sem) document.getElementById('semana-input').value = sem;
}

init();
</script>
</body>
</html>
