<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrossFit — Planificación Randy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a1a, #2c2c2c);
      padding: 24px 32px 0;
      border-bottom: 3px solid #e63946;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
    }
    header h1 span { color: #e63946; }
    header p { color: #888; font-size: 0.85rem; margin-top: 4px; }

    .unlock-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #2d9e6b;
      background: rgba(45,158,107,0.1);
      border: 1px solid rgba(45,158,107,0.3);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .unlock-badge:hover { background: rgba(45,158,107,0.2); }
    .unlock-badge.visible { display: flex; }

    .days-nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      margin-top: 16px;
    }
    .day-btn {
      flex-shrink: 0;
      padding: 12px 24px;
      background: transparent;
      color: #aaa;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      bottom: -3px;
    }
    .day-btn:hover { color: #fff; background: rgba(230,57,70,0.1); }
    .day-btn.active { color: #e63946; border-bottom: 3px solid #e63946; background: rgba(230,57,70,0.08); }
    .rest-badge {
      font-size: 0.6rem;
      background: #444;
      color: #aaa;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .day-btn.active .rest-badge { background: rgba(230,57,70,0.3); color: #e63946; }

    /* ── Layout principal ── */
    main { padding: 32px; max-width: 900px; margin: 0 auto; }

    .day-panel { display: none; animation: fadeIn 0.3s ease; }
    .day-panel.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .day-title { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    .day-title span { color: #e63946; }

    .edit-btn {
      padding: 8px 20px;
      background: #e63946; color: #fff; border: none;
      border-radius: 6px; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.2s;
    }
    .edit-btn:hover { background: #c1121f; }
    .save-btn {
      padding: 8px 20px;
      background: #2d6a4f; color: #fff; border: none;
      border-radius: 6px; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover { background: #1b4332; }

    /* ── Sección card ── */
    .section-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 20px 24px;
    }
    .section-card .sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .section-card h3 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #e63946;
    }
    /* hint de formato en modo edición */
    .edit-hint {
      display: none;
      font-size: 0.7rem;
      color: #555;
      background: #111;
      border: 1px dashed #333;
      border-radius: 6px;
      padding: 5px 10px;
      line-height: 1.5;
    }
    .edit-hint code { color: #888; background: #1a1a1a; padding: 1px 4px; border-radius: 3px; }
    .edit-hint.visible { display: block; }

    /* contenido renderizado */
    .content-text {
      color: #ccc;
      line-height: 2;
      font-size: 0.95rem;
    }
    .content-text:empty::after { content: '—'; color: #333; }

    /* link inline de video */
    .vid-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #e63946;
      background: rgba(230,57,70,0.1);
      border: 1px solid rgba(230,57,70,0.3);
      border-radius: 12px;
      padding: 2px 9px;
      text-decoration: none;
      vertical-align: middle;
      margin-left: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .vid-link:hover { background: rgba(230,57,70,0.22); border-color: rgba(230,57,70,0.6); }
    .vid-link svg { flex-shrink: 0; }

    /* textarea edición */
    .section-card textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #f0f0f0;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.8;
      padding: 12px;
      resize: vertical;
      min-height: 90px;
      outline: none;
      display: none;
    }
    .section-card textarea:focus { border-color: #e63946; }

    /* colores por tipo */
    .sec-calentamiento  { border-left: 4px solid #f4a261; }
    .sec-calentamiento h3 { color: #f4a261; }
    .sec-levantamiento  { border-left: 4px solid #a8dadc; }
    .sec-levantamiento h3 { color: #a8dadc; }
    .sec-workout        { border-left: 4px solid #e63946; background: linear-gradient(135deg,#1e0a0a,#1a1a1a); }
    .sec-workout h3     { color: #e63946; }
    .sec-accesorios     { border-left: 4px solid #9b72cf; }
    .sec-accesorios h3  { color: #9b72cf; }

    /* ── Nota entre secciones ── */
    .note-bridge {
      position: relative;
      margin: 6px 0;
      padding: 10px 16px 10px 44px;
      background: rgba(255,214,0,0.04);
      border: 1px dashed rgba(255,214,0,0.15);
      border-radius: 8px;
      min-height: 38px;
    }
    .note-bridge::before {
      content: '📝';
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
    }
    .note-bridge .note-text {
      color: #b5a000;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      min-height: 16px;
    }
    .note-bridge .note-text:empty::after { content: 'Sin nota'; color: #2e2700; font-style: italic; }
    .note-bridge textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255,214,0,0.25);
      color: #e6c800;
      font-family: inherit;
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 2px 0;
      resize: vertical;
      min-height: 36px;
      outline: none;
      display: none;
    }
    .note-bridge textarea::placeholder { color: rgba(230,200,0,0.25); }
    .note-bridge textarea:focus { border-bottom-color: rgba(255,214,0,0.5); }

    /* ── Workout 2 toggle ── */
    .w2-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }
    .w2-toggle-btn {
      padding: 7px 18px;
      background: transparent;
      border: 1px dashed #2a2a2a;
      border-radius: 20px;
      color: #444;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .w2-toggle-btn:hover { border-color: #e63946; color: #e63946; }
    .w2-toggle-btn.active { border-color: #e63946; color: #e63946; background: rgba(230,57,70,0.06); }

    .w2-block { display: none; }
    .w2-block.visible { display: block; }

    /* ── Descanso ── */
    .rest-day { text-align: center; padding: 50px 20px 30px; }
    .rest-day .icon { font-size: 4rem; margin-bottom: 16px; }
    .rest-day h2 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; color: #555; letter-spacing: 3px; }
    .rest-day p { color: #444; margin-top: 8px; font-size: 0.9rem; }

    /* ── Semana ── */
    .week-banner {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .week-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2px; color: #555; }
    .week-banner input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      color: #fff; font-size: 1rem; font-weight: 700;
      padding: 4px 0; outline: none; width: 240px;
    }
    .week-banner input:focus { border-bottom-color: #e63946; }
    .week-banner input[readonly] { cursor: default; pointer-events: none; }

    /* ── Modal contraseña ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.visible { display: flex; animation: fadeIn 0.2s ease; }
    .modal-box {
      background: #1a1a1a; border: 1px solid #333;
      border-top: 3px solid #e63946; border-radius: 12px;
      padding: 32px; width: 340px; text-align: center;
    }
    .modal-box .lock-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .modal-box h2 { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
    .modal-box p { font-size: 0.8rem; color: #666; margin-bottom: 20px; }
    .modal-box input[type="password"] {
      width: 100%; background: #111; border: 1px solid #333; border-radius: 6px;
      color: #f0f0f0; font-size: 1rem; padding: 10px 14px; outline: none;
      margin-bottom: 12px; letter-spacing: 3px;
    }
    .modal-box input[type="password"]:focus { border-color: #e63946; }
    .error-msg { color: #e63946; font-size: 0.8rem; margin-bottom: 10px; min-height: 18px; }
    .modal-actions { display: flex; gap: 10px; }
    .btn-confirm {
      flex: 1; padding: 10px; background: #e63946; color: #fff; border: none;
      border-radius: 6px; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    }
    .btn-confirm:hover { background: #c1121f; }
    .btn-cancel {
      flex: 1; padding: 10px; background: #2a2a2a; color: #aaa; border: none;
      border-radius: 6px; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    }
    .btn-cancel:hover { background: #333; }
  </style>
</head>
<body>

<!-- Modal contraseña -->
<div class="modal-overlay" id="pwd-modal">
  <div class="modal-box">
    <div class="lock-icon">🔒</div>
    <h2>Modo edición</h2>
    <p>Introduce tu contraseña para editar</p>
    <input type="password" id="pwd-input" placeholder="••••••••"
           onkeydown="if(event.key==='Enter') confirmPwd()" />
    <div class="error-msg" id="pwd-error"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closePwdModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmPwd()">Desbloquear</button>
    </div>
  </div>
</div>

<header>
  <div class="header-top">
    <div>
      <h1>Cross<span>Fit</span> &mdash; Planificación Randy</h1>
      <p>Semana de entrenamiento personalizada</p>
    </div>
    <button class="unlock-badge" id="unlock-badge" onclick="lockSession()">
      🔓 Desbloqueado — bloquear
    </button>
  </div>
  <nav class="days-nav">
    <button class="day-btn active" onclick="showDay('lunes',this)">Lunes</button>
    <button class="day-btn" onclick="showDay('martes',this)">Martes</button>
    <button class="day-btn" onclick="showDay('miercoles',this)">Miércoles</button>
    <button class="day-btn" onclick="showDay('jueves',this)">Jueves</button>
    <button class="day-btn" onclick="showDay('viernes',this)">Viernes</button>
    <button class="day-btn" onclick="showDay('sabado',this)">Sábado</button>
    <button class="day-btn" onclick="showDay('domingo',this)">Domingo <span class="rest-badge">REST</span></button>
  </nav>
</header>

<main>
  <div class="week-banner">
    <span class="week-label">Semana</span>
    <input type="text" id="semana-input" placeholder="Ej: 26 May – 1 Jun 2025" readonly />
  </div>

  <div id="panel-lunes"     class="day-panel active" data-day="lunes"></div>
  <div id="panel-martes"    class="day-panel"        data-day="martes"></div>
  <div id="panel-miercoles" class="day-panel"        data-day="miercoles"></div>
  <div id="panel-jueves"    class="day-panel"        data-day="jueves"></div>
  <div id="panel-viernes"   class="day-panel"        data-day="viernes"></div>
  <div id="panel-sabado"    class="day-panel"        data-day="sabado"></div>

  <!-- DOMINGO -->
  <div id="panel-domingo" class="day-panel">
    <div class="day-header">
      <div class="day-title">Domingo <span>/ Descanso</span></div>
    </div>
    <div class="rest-day">
      <div class="icon">🛌</div>
      <h2>Día de descanso</h2>
      <p>Recuperación activa, movilidad suave o completo reposo.</p>
    </div>
    <div class="section-card sec-accesorios" style="margin-top:16px">
      <div class="sec-header"><h3>Notas de recuperación</h3></div>
      <div class="content-text" id="domingo-notas"></div>
      <textarea id="domingo-notas-edit"></textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="edit-btn" id="domingo-edit-btn" onclick="toggleDomingo()">Editar notas</button>
    </div>
  </div>
</main>

<script>
// ─── Datos ────────────────────────────────────────────────────────────────────
const DAYS_TRAINING = ['lunes','martes','miercoles','jueves','viernes','sabado'];
const DAYS_ALL      = [...DAYS_TRAINING, 'domingo'];
const MAIN_SECS     = ['calentamiento','levantamiento','workout1','workout2','accesorios'];
const NOTE_KEYS     = ['nota1','nota2','nota3','nota4'];

const DAY_LABELS = {
  lunes:'Lunes / Día 1', martes:'Martes / Día 2', miercoles:'Miércoles / Día 3',
  jueves:'Jueves / Día 4', viernes:'Viernes / Día 5', sabado:'Sábado / Día 6',
};

const DEFAULTS = {
  calentamiento:
`3 rondas:
- 400m trote suave
- 10 hip circles cada lado
- 10 dislocaciones con palo
- 15 hollow rocks`,
  levantamiento:
`Back Squat – 5 × 5
Empezar al 70% 1RM.
Aumentar carga si la técnica es sólida.`,
  workout1:
`AMRAP 20 min:
- 5 Pull-ups
- 10 Push-ups
- 15 Air Squats`,
  workout2: '',
  accesorios:
`- 3 × 15 GHD Sit-ups
- 3 × 12 Single-leg RDL cada lado
- 2 min plank hold`,
  nota1:'', nota2:'', nota3:'', nota4:'',
};

const DOMINGO_DEFAULT =
`- Foam roller cuerpo completo 10 min
- Yoga o stretching 20-30 min
- Hidratación mínima 2.5 L
- Dormir 8 horas`;

// ─── Contraseña ───────────────────────────────────────────────────────────────
// Contraseña por defecto: crossfit2025
// Para cambiarla estando desbloqueado abre la consola y escribe:
//   cambiarContrasena('nueva_clave')
let sessionUnlocked = false;
let pendingCb = null;

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function getStoredHash() {
  let h = localStorage.getItem('cf_pwd_hash');
  if (!h) { h = await sha256('crossfit2025'); localStorage.setItem('cf_pwd_hash', h); }
  return h;
}
window.cambiarContrasena = async function(nueva) {
  if (!sessionUnlocked) { alert('Debes estar desbloqueado primero.'); return; }
  localStorage.setItem('cf_pwd_hash', await sha256(nueva));
  alert('Contraseña cambiada correctamente.');
};
function requireAuth(cb) {
  if (sessionUnlocked) { cb(); return; }
  pendingCb = cb; openPwdModal();
}
function openPwdModal() {
  document.getElementById('pwd-input').value = '';
  document.getElementById('pwd-error').textContent = '';
  document.getElementById('pwd-modal').classList.add('visible');
  setTimeout(() => document.getElementById('pwd-input').focus(), 80);
}
function closePwdModal() {
  document.getElementById('pwd-modal').classList.remove('visible');
  pendingCb = null;
}
async function confirmPwd() {
  const val = document.getElementById('pwd-input').value;
  if (!val) return;
  if (await sha256(val) === await getStoredHash()) {
    sessionUnlocked = true;
    document.getElementById('unlock-badge').classList.add('visible');
    closePwdModal();
    if (pendingCb) { pendingCb(); pendingCb = null; }
  } else {
    document.getElementById('pwd-error').textContent = 'Contraseña incorrecta';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}
function lockSession() {
  sessionUnlocked = false;
  document.getElementById('unlock-badge').classList.remove('visible');
  DAYS_TRAINING.forEach(d => { if (editingState[d]) doSave(d); });
  if (editingDomingo) toggleDomingo();
}
document.getElementById('pwd-modal').addEventListener('click', e => {
  if (e.target.id === 'pwd-modal') closePwdModal();
});

// ─── Navegación ───────────────────────────────────────────────────────────────
function showDay(day, btn) {
  DAYS_ALL.forEach(d => document.getElementById('panel-' + d).classList.remove('active'));
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + day).classList.add('active');
  btn.classList.add('active');
}

// ─── Render de contenido con links inline ─────────────────────────────────────
// Formato: "Nombre del ejercicio [https://...]"
// En display se convierte en: "Nombre del ejercicio ▶ ver video"
const URL_PATTERN = /\[(https?:\/\/[^\]]+)\]/g;

const PLAY_ICON = `<svg width="8" height="9" viewBox="0 0 8 9" fill="currentColor"><path d="M0 0 L8 4.5 L0 9 Z"/></svg>`;

function renderContent(rawText) {
  // Escapar HTML primero
  const escaped = rawText
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  // Convertir [URL] → botón "ver video"
  const withLinks = escaped.replace(
    /\[(https?:\/\/[^\]]+)\]/g,
    (_, url) => `<a class="vid-link" href="${url}" target="_blank" rel="noopener noreferrer">${PLAY_ICON} ver video</a>`
  );

  // Saltos de línea
  return withLinks.replace(/\n/g, '<br>');
}

function getRawText(day, key) {
  const saved = localStorage.getItem('cf_' + day + '_' + key);
  return saved !== null ? saved : (DEFAULTS[key] ?? '');
}

// ─── Construcción del panel ───────────────────────────────────────────────────
function buildDayPanel(day) {
  const panel = document.getElementById('panel-' + day);
  const [title, sub] = DAY_LABELS[day].split(' / ');
  panel.innerHTML = `
    <div class="day-header">
      <div class="day-title">${title} <span>/ ${sub}</span></div>
      <button class="edit-btn" id="${day}-edit-btn" onclick="toggleEdit('${day}')">Editar</button>
    </div>

    <!-- CALENTAMIENTO -->
    <div class="section-card sec-calentamiento">
      <div class="sec-header">
        <h3>🔥 Calentamiento</h3>
        <span class="edit-hint" id="${day}-calentamiento-hint">Para añadir video: escribe el nombre del ejercicio y pega la URL entre corchetes<br><code>Ejercicio [https://youtube.com/...]</code></span>
      </div>
      <div class="content-text" id="${day}-calentamiento"></div>
      <textarea id="${day}-calentamiento-edit" placeholder="Describe el calentamiento...&#10;Ej: - Thruster [https://youtube.com/...]"></textarea>
    </div>

    <div class="note-bridge">
      <div class="note-text" id="${day}-nota1"></div>
      <textarea id="${day}-nota1-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    <!-- LEVANTAMIENTO -->
    <div class="section-card sec-levantamiento">
      <div class="sec-header">
        <h3>🏋️ Levantamiento</h3>
        <span class="edit-hint" id="${day}-levantamiento-hint">Para añadir video: <code>Ejercicio [https://youtube.com/...]</code></span>
      </div>
      <div class="content-text" id="${day}-levantamiento"></div>
      <textarea id="${day}-levantamiento-edit" placeholder="Series, repeticiones, % de 1RM..."></textarea>
    </div>

    <div class="note-bridge">
      <div class="note-text" id="${day}-nota2"></div>
      <textarea id="${day}-nota2-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    <!-- WORKOUT 1 -->
    <div class="section-card sec-workout">
      <div class="sec-header">
        <h3>⚡ Workout 1</h3>
        <span class="edit-hint" id="${day}-workout1-hint">Para añadir video: <code>Ejercicio [https://youtube.com/...]</code></span>
      </div>
      <div class="content-text" id="${day}-workout1"></div>
      <textarea id="${day}-workout1-edit" placeholder="AMRAP, Para tiempo, EMOM..."></textarea>
    </div>

    <div class="note-bridge">
      <div class="note-text" id="${day}-nota3"></div>
      <textarea id="${day}-nota3-edit" placeholder="Nota para el atleta..."></textarea>
    </div>

    <!-- WORKOUT 2 toggle -->
    <div class="w2-toggle-row">
      <button class="w2-toggle-btn" id="${day}-w2-btn" onclick="toggleW2('${day}')">＋ Agregar Workout 2</button>
    </div>

    <div class="w2-block" id="${day}-w2-block">
      <div class="section-card sec-workout">
        <div class="sec-header">
          <h3>⚡ Workout 2</h3>
          <span class="edit-hint" id="${day}-workout2-hint">Para añadir video: <code>Ejercicio [https://youtube.com/...]</code></span>
        </div>
        <div class="content-text" id="${day}-workout2"></div>
        <textarea id="${day}-workout2-edit" placeholder="Segundo workout del día..."></textarea>
      </div>
      <div class="note-bridge">
        <div class="note-text" id="${day}-nota4"></div>
        <textarea id="${day}-nota4-edit" placeholder="Nota para el atleta..."></textarea>
      </div>
    </div>

    <!-- ACCESORIOS -->
    <div class="section-card sec-accesorios" style="margin-top:6px">
      <div class="sec-header">
        <h3>💪 Accesorios</h3>
        <span class="edit-hint" id="${day}-accesorios-hint">Para añadir video: <code>Ejercicio [https://youtube.com/...]</code></span>
      </div>
      <div class="content-text" id="${day}-accesorios"></div>
      <textarea id="${day}-accesorios-edit" placeholder="Ejercicios accesorios, core, movilidad..."></textarea>
    </div>
  `;
}

// ─── Estado de edición ────────────────────────────────────────────────────────
let editingState = {};

function toggleEdit(day) {
  requireAuth(() => {
    if (!editingState[day]) doOpen(day);
    else doSave(day);
  });
}

function doOpen(day) {
  // Secciones de texto
  MAIN_SECS.forEach(k => {
    const display = document.getElementById(day + '-' + k);
    const ta      = document.getElementById(day + '-' + k + '-edit');
    const hint    = document.getElementById(day + '-' + k + '-hint');
    if (!display || !ta) return;
    ta.value = getRawText(day, k);
    display.style.display = 'none';
    ta.style.display = 'block';
    if (hint) hint.classList.add('visible');
  });
  // Notas
  NOTE_KEYS.forEach(k => {
    const display = document.getElementById(day + '-' + k);
    const ta      = document.getElementById(day + '-' + k + '-edit');
    if (!display || !ta) return;
    ta.value = getRawText(day, k);
    display.style.display = 'none';
    ta.style.display = 'block';
  });

  document.getElementById('semana-input').removeAttribute('readonly');
  const btn = document.getElementById(day + '-edit-btn');
  if (btn) { btn.textContent = 'Guardar'; btn.className = 'save-btn'; }
  editingState[day] = true;
}

function doSave(day) {
  MAIN_SECS.forEach(k => {
    const display = document.getElementById(day + '-' + k);
    const ta      = document.getElementById(day + '-' + k + '-edit');
    const hint    = document.getElementById(day + '-' + k + '-hint');
    if (!display || !ta) return;
    const raw = ta.value;
    display.innerHTML = renderContent(raw);
    ta.style.display = 'none';
    display.style.display = '';
    if (hint) hint.classList.remove('visible');
    try { localStorage.setItem('cf_' + day + '_' + k, raw); } catch(e) {}
  });
  NOTE_KEYS.forEach(k => {
    const display = document.getElementById(day + '-' + k);
    const ta      = document.getElementById(day + '-' + k + '-edit');
    if (!display || !ta) return;
    display.textContent = ta.value;
    ta.style.display = 'none';
    display.style.display = '';
    try { localStorage.setItem('cf_' + day + '_' + k, ta.value); } catch(e) {}
  });

  document.getElementById('semana-input').setAttribute('readonly', true);
  try { localStorage.setItem('cf_semana', document.getElementById('semana-input').value); } catch(e) {}

  const btn = document.getElementById(day + '-edit-btn');
  if (btn) { btn.textContent = 'Editar'; btn.className = 'edit-btn'; }
  editingState[day] = false;
}

// ─── Workout 2 ────────────────────────────────────────────────────────────────
function toggleW2(day) {
  requireAuth(() => {
    const block   = document.getElementById(day + '-w2-block');
    const btn     = document.getElementById(day + '-w2-btn');
    const visible = block.classList.toggle('visible');
    btn.classList.toggle('active', visible);
    btn.textContent = visible ? '✕ Quitar Workout 2' : '＋ Agregar Workout 2';
    try { localStorage.setItem('cf_' + day + '_w2visible', visible ? '1' : '0'); } catch(e) {}
  });
}

// ─── Domingo ──────────────────────────────────────────────────────────────────
let editingDomingo = false;

function toggleDomingo() {
  requireAuth(() => {
    const display = document.getElementById('domingo-notas');
    const ta      = document.getElementById('domingo-notas-edit');
    const btn     = document.getElementById('domingo-edit-btn');
    if (!editingDomingo) {
      ta.value = display.textContent || DOMINGO_DEFAULT;
      display.style.display = 'none';
      ta.style.display = 'block';
      btn.textContent = 'Guardar'; btn.className = 'save-btn';
      editingDomingo = true;
    } else {
      display.textContent = ta.value;
      ta.style.display = 'none';
      display.style.display = '';
      btn.textContent = 'Editar notas'; btn.className = 'edit-btn';
      try { localStorage.setItem('cf_domingo_notas', ta.value); } catch(e) {}
      editingDomingo = false;
    }
  });
}

// ─── Campo semana ─────────────────────────────────────────────────────────────
document.getElementById('semana-input').addEventListener('click', function() {
  if (this.hasAttribute('readonly'))
    requireAuth(() => { this.removeAttribute('readonly'); this.focus(); });
});

// ─── Carga inicial ────────────────────────────────────────────────────────────
function loadDay(day) {
  MAIN_SECS.forEach(k => {
    const el = document.getElementById(day + '-' + k);
    if (el) el.innerHTML = renderContent(getRawText(day, k));
  });
  NOTE_KEYS.forEach(k => {
    const el = document.getElementById(day + '-' + k);
    if (el) el.textContent = getRawText(day, k);
  });
  // Workout 2 visibilidad guardada
  if (localStorage.getItem('cf_' + day + '_w2visible') === '1') {
    const block = document.getElementById(day + '-w2-block');
    const btn   = document.getElementById(day + '-w2-btn');
    if (block) { block.classList.add('visible'); btn.classList.add('active'); btn.textContent = '✕ Quitar Workout 2'; }
  }
}

function init() {
  DAYS_TRAINING.forEach(day => { buildDayPanel(day); loadDay(day); });

  // Domingo
  const domSaved = localStorage.getItem('cf_domingo_notas');
  document.getElementById('domingo-notas').textContent = domSaved !== null ? domSaved : DOMINGO_DEFAULT;

  // Semana
  const sem = localStorage.getItem('cf_semana');
  if (sem) document.getElementById('semana-input').value = sem;
}

init();
</script>
</body>
